# Lefthook — Git hooks for expo-supabase-template
# Install once per clone: `bunx lefthook install`
# Bypass an individual commit (rare, justify in commit msg): LEFTHOOK=0 git commit
#
# AGENTS.md / CLAUDE.md are the source of truth for repo conventions. Read them first.

pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{ts,tsx,js,jsx,json,jsonc}"
      run: bunx biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

    typecheck:
      # Type-check entire workspace — fast enough on Expo single-package.
      # Per-file typecheck is unreliable across path aliases.
      glob: "*.{ts,tsx}"
      run: bun run typecheck

    gitleaks:
      # Secret scan on staged files. Guarded: skips locally when gitleaks isn't
      # installed (brew install gitleaks) — CI security.yml enforces it anyway.
      run: |
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks git --staged --config=.gitleaks.toml --redact --no-banner
        else
          echo "gitleaks not installed — skipping local scan (CI enforces)"
        fi

pre-push:
  commands:
    test:
      # Block pushing red. CI runs the same suite; local catch saves a CI cycle.
      run: bun test src

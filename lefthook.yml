# Lefthook — Git hooks for expo-supabase-template
# Install once per clone: `bunx lefthook install`
# Bypass an individual commit (rare, justify in commit msg): LEFTHOOK=0 git commit
#
# AGENTS.md / CLAUDE.md are the source of truth for repo conventions. Read them first.

pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{ts,tsx,js,jsx,json,jsonc}"
      run: bunx biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

    typecheck:
      # Type-check entire workspace — fast enough on Expo single-package.
      # Per-file typecheck is unreliable across path aliases.
      glob: "*.{ts,tsx}"
      run: bun run typecheck

pre-push:
  commands:
    # No tests configured yet at template level. Add `bun run test` once Vitest
    # is wired up in the forked project. Until then this hook is a no-op.
    noop:
      run: echo "lefthook pre-push noop — add test runner when ready"

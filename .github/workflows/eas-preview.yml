name: EAS Preview Build

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'app.json'
      - 'eas.json'
      - 'package.json'
      - 'bun.lock'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Empty on the template repo itself (no EAS project) — EAS steps are
      # skipped with a notice. Forks set the secret and get real preview builds.
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test src

      - name: Setup EAS
        if: env.EXPO_TOKEN != ''
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS preview build (no-wait)
        if: env.EXPO_TOKEN != ''
        run: eas build --profile preview --platform ios --non-interactive --no-wait

      - name: EAS skipped notice
        if: env.EXPO_TOKEN == ''
        run: echo "EXPO_TOKEN not set — EAS preview build skipped (expected on the template repo; forks configure the secret)."
